<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p>
        <label for="n1">Digite o primeiro número:</label>
        <input type="text" name="n1" id="n1" min="0" max="50" required
        oninput="soma.innerHTML = Number(n1.value) + Number (n2.value)">
        
    </p>

    <p>
        <label for="n2">Digite o segundo número:</label>
        <input type="text" name="n2" id="n2" min="0" max="50" required 
        oninput="soma.innerHTML = Number(n1.value) + Number (n2.value)">

    </p>

    <p>
        <label for="soma">Soma:</label>
        <output name="soma" id="soma">0</output>   </p>





    <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>
    
</body>
