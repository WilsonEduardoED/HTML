<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p>
        <label for="ano">Em que ano voce nasceu </label>
        <input type="number" name="ano" id="ano" min="1900" max="2026"
        oninput="CalcIdade()">
    </p>

    <p>
        <label for="idade">Sua idade é:</label>
        <output id="idade">0</output>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
        </p>

                <script>

                    function CalcIdade(){

                        let actual = new Date().getFullYear()
                        idade.innerHTML = Number(actual) - Number(ano.value)

                    }
                </script>
</body>
</html>
